name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "Dockerfile*"
      - ".github/workflows/build-and-push.yml"

jobs:
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty | sed 's/^v//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-api:latest
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-api:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-api:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty | sed 's/^v//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-web:latest
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-web:${{ steps.version.outputs.tag }}
            ${{ secrets.REGISTRY_URL }}/doc-ingestion-web:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=/api
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN_FRONTEND }}
            VITE_ENV=production

  security-scan:
    name: Security Scan Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY_URL }}/doc-ingestion-api:latest
          format: "sarif"
          output: "trivy-backend.sarif"
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: "trivy-backend.sarif"
        continue-on-error: true

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, security-scan]
    if: always()
    steps:
      - name: Build Status
        run: |
          echo "Build completed with status: ${{ job.status }}"
          echo "Backend: ${{ needs.build-backend.result }}"
          echo "Frontend: ${{ needs.build-frontend.result }}"
