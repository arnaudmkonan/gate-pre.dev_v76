name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: services/api

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/
        working-directory: services/api
        continue-on-error: true

      - name: Type check with pyright
        run: |
          pip install pyright
          pyright app/
        working-directory: services/api
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest app/tests/ -v --tb=short --cov=app --cov-report=xml
        working-directory: services/api

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api/coverage.xml
          fail_ci_if_error: false

  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint with ESLint
        run: npm run lint
        working-directory: apps/web
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        working-directory: apps/web
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: apps/web

      - name: Run unit tests
        run: npm run test
        working-directory: apps/web
        continue-on-error: true

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python, javascript
        continue-on-error: true

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v2
        continue-on-error: true

      - name: Dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          path: "."
          format: "JSON"
        continue-on-error: true

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "Backend or Frontend tests failed"
            exit 1
          fi
