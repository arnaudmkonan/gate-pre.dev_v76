name: E2E Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment file
        run: |
          cp .env.example .env
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> .env
          echo "SEED_DEMO_USERS=true" >> .env
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            sed -i "s|OPENAI_API_KEY=.*|OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}|" .env
          fi

      - name: Build and start stack
        run: docker compose up -d --build postgres redis api worker beat frontend landing

      - name: Wait for health endpoints
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null && curl -sf http://localhost:3000/login >/dev/null; then
              echo "Stack ready"
              exit 0
            fi
            sleep 5
          done
          echo "Stack failed to become ready"
          docker compose ps
          docker compose logs api --tail=80
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          CI: "true"
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Tear down
        if: always()
        run: docker compose down -v
