services:
  # =============================================================================
  # DATABASE - PostgreSQL with pgvector extension
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docingestion_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doc_ingestion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d doc_ingestion" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - docingestion_network
    restart: unless-stopped

  # =============================================================================
  # CACHE / MESSAGE BROKER - Redis
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: docingestion_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docingestion_network
    restart: unless-stopped

  # =============================================================================
  # BACKEND API - FastAPI
  # =============================================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: docingestion_api
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/doc_ingestion
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/doc_ingestion
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"
      ENVIRONMENT: development
      # Sentry (disabled by default)
      SENTRY_ENABLED: "false"
      # Local storage for development (no cloud storage needed)
      LOCAL_STORAGE_PATH: /app/storage
    env_file:
      - .env
    volumes:
      - ./services/api:/app
      - api_cache:/app/.cache
      - local_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - docingestion_network
    restart: unless-stopped
    # For development, use reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # =============================================================================
  # CELERY WORKER - Background task processing
  # =============================================================================
  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: docingestion_worker
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/doc_ingestion
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/doc_ingestion
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Environment
      ENVIRONMENT: development
      SENTRY_ENABLED: "false"
      # Local storage (shared with API)
      LOCAL_STORAGE_PATH: /app/storage
    env_file:
      - .env
    volumes:
      - ./services/api:/app
      - local_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - docingestion_network
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: [ "CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # CELERY BEAT - Scheduled tasks
  # =============================================================================
  beat:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: docingestion_beat
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/doc_ingestion
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@postgres:5432/doc_ingestion
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Environment
      ENVIRONMENT: development
      SENTRY_ENABLED: "false"
    env_file:
      - .env
    volumes:
      - ./services/api:/app
    depends_on:
      - worker
    networks:
      - docingestion_network
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'exit(0)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # FRONTEND - React/Vite
  # =============================================================================
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: docingestion_frontend
    ports:
      - "3000:3000"
    environment:
      DOCKER_ENV: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - docingestion_network
    restart: unless-stopped

  # =============================================================================
  # PGWEB - Database visualization
  # =============================================================================
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: docingestion_pgweb
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/doc_ingestion?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - docingestion_network
    restart: unless-stopped

  # =============================================================================
  # FLOWER - Celery monitoring dashboard
  # =============================================================================
  flower:
    image: mher/flower:2.0
    container_name: docingestion_flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: admin:admin
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - docingestion_network
    restart: unless-stopped

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_cache:
    driver: local
  local_storage:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  docingestion_network:
    driver: bridge
