[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-ingestion-api"
version = "0.1.0"
description = "Multi-agent documentation ingestion platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "boto3>=1.28.0",
    "supabase>=2.0.0",
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "openai>=1.3.0",
    "langchain>=0.1.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "sentry-sdk>=1.40.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "pgvector>=0.2.0",
    "croniter>=2.0.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
