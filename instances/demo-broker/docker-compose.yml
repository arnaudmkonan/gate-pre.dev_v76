version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: gate_${CUSTOMER_ID}_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${EXTERNAL_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gate_${CUSTOMER_ID}_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${EXTERNAL_REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: gate-platform/api:latest
    container_name: gate_${CUSTOMER_ID}_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT}
      - CUSTOMER_ID=${CUSTOMER_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - storage_data:/app/storage
      - ./certs:/app/certs:ro
    ports:
      - "${EXTERNAL_API_PORT}:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    image: gate-platform/api:latest
    container_name: gate_${CUSTOMER_ID}_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

  beat:
    image: gate-platform/api:latest
    container_name: gate_${CUSTOMER_ID}_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_SYNC=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    restart: unless-stopped

  flower:
    image: mher/flower:0.9.7
    container_name: gate_${CUSTOMER_ID}_flower
    command: celery flower --broker=${CELERY_BROKER_URL}
    depends_on:
      - redis
    ports:
      - "${EXTERNAL_FLOWER_PORT}:5555"
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: gate_${CUSTOMER_ID}_pgweb
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGWEB_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${EXTERNAL_PGWEB_PORT:-5700}:8081"
    restart: unless-stopped

  frontend:
    image: gate-platform/web:latest
    container_name: gate_${CUSTOMER_ID}_web
    depends_on:
      - api
    environment:
      - VITE_API_URL=https://${SUBDOMAIN}.gateplatform.com/api
    ports:
      - "${EXTERNAL_WEB_PORT}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:


networks:
  default:
    name: gate_${CUSTOMER_ID}_network
