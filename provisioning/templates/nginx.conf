# GATE Platform - Nginx Configuration for Multi-Instance Deployment
#
# This configuration handles:
# - SSL termination with Let's Encrypt
# - Wildcard subdomain routing
# - WebSocket support
# - Security headers
#
# Prerequisites:
# 1. Wildcard DNS: *.gateplatform.com → your-server-ip
# 2. Wildcard SSL cert: /etc/letsencrypt/live/gateplatform.com/fullchain.pem
#
# To generate wildcard cert:
# certbot certonly --dns-cloudflare -d "*.gateplatform.com" -d "gateplatform.com"

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Upstream definitions (generated by provisioning system)
# Include this file which is auto-generated by provision.sh
include /etc/nginx/conf.d/gate-upstreams.conf;

# Main landing page (gateplatform.com)
server {
    listen 80;
    listen [::]:80;
    server_name gateplatform.com www.gateplatform.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateplatform.com www.gateplatform.com;
    
    ssl_certificate /etc/letsencrypt/live/gateplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateplatform.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Landing page
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Customer subdomains (*.gateplatform.com)
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>.+)\.gateplatform\.com$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<subdomain>.+)\.gateplatform\.com$;
    
    ssl_certificate /etc/letsencrypt/live/gateplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateplatform.com/privkey.pem;
    
    # SSL configuration (same as above)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Customer ID header for logging
    add_header X-Customer-Subdomain $subdomain;
    
    # Logging
    access_log /var/log/nginx/gate_$subdomain.access.log;
    error_log /var/log/nginx/gate.error.log;
    
    # File upload limit (for document ingestion)
    client_max_body_size 100M;
    
    # API routes
    location /api {
        # Rate limiting for login
        location /api/portal/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://gate_${subdomain}_api;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }
        
        # General API rate limiting
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://gate_${subdomain}_api;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }
    
    # WebSocket support for real-time features
    location /ws {
        proxy_pass http://gate_${subdomain}_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Frontend (React app)
    location / {
        proxy_pass http://gate_${subdomain}_web;
        include /etc/nginx/conf.d/proxy-headers.conf;
        
        # SPA routing - serve index.html for client-side routes
        try_files $uri $uri/ @spa;
    }
    
    location @spa {
        proxy_pass http://gate_${subdomain}_web;
        proxy_set_header Accept text/html;
    }
    
    # Health check endpoint (for load balancers)
    location /health {
        proxy_pass http://gate_${subdomain}_api/api/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

